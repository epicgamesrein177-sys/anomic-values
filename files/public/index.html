<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Anomic Values | Anomic Roblox Trading Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest" defer></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0a0a0a;
            color: #ffffff;
            scroll-behavior: smooth;
        }
        .bg-glass {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .bg-glass-card {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.05) 0%, rgba(255, 255, 255, 0.02) 100%);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .gradient-title {
            background: linear-gradient(90deg, #ff7a00 0%, #ff3d00 25%, #ff2d55 50%, #ff3d00 75%, #ff7a00 100%);
            background-size: 200% auto;
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        @keyframes gradientShift {
            0% {
                background-position: 0% center;
            }
            100% {
                background-position: 200% center;
            }
        }
    </style>
</head>
<body class="antialiased">

    <!-- Login Modal -->
    <div
        id="login-modal"
        style="display: none; position: fixed; inset: 0; z-index: 100000; background: rgba(0,0,0,0.8); backdrop-filter: blur(10px); display: flex; align-items: center; justify-content: center;"
    >
        <div
            class="bg-glass-card"
            style="border-radius: 24px; padding: 48px; text-align: center; max-width: 420px; width: 100%; margin: 24px;"
        >
            <h2
                class="text-3xl font-bold gradient-title"
                style="margin-bottom: 16px; animation: gradientShift 3s linear infinite;"
            >
                Welcome!
            </h2>
            <p style="color: #9ca3af; margin-bottom: 32px;">Log in with Discord to continue to Anomic Values.</p>
            <a
                href="/auth/discord"
                id="discord-login-btn"
                style="
                display: inline-flex;
                align-items: center;
                gap: 12px;
                background: #5865F2;
                color: white;
                padding: 14px 28px;
                border-radius: 999px;
                font-weight: 600;
                text-decoration: none;
                transition: all 0.3s ease;
            "
            >
                <i data-lucide="log-in"></i>
                Log In with Discord
            </a>
        </div>
    </div>

    <div id="main-content" style="display: none;">
        <!-- Navbar -->
        <nav
            class="fixed top-0 w-full z-50 bg-glass py-4 px-6 md:px-12 flex items-center justify-between"
        >
            <div class="flex items-center space-x-2">
                <i data-lucide="zap" class="text-blue-500 w-8 h-8"></i>
                <span class="text-xl font-bold tracking-tight">ANOMIC VALUES</span>
            </div>
            <div class="hidden md:flex space-x-8 text-sm font-medium">
                <a href="#" class="hover:text-blue-500 transition-colors">Home</a>
            </div>
            <div id="auth-area" class="flex items-center gap-3">
                <a
                    href="/auth/discord"
                    id="login-btn"
                    style="
                    display: none;
                    background: rgba(88, 101, 242, 0.2);
                    border: 1px solid rgba(88, 101, 242, 0.4);
                    color: #818cf8;
                    padding: 7px 16px;
                    border-radius: 999px;
                    font-size: 13px;
                    font-weight: 600;
                    cursor: pointer;
                    display: flex;
                    align-items: center;
                    gap: 7px;
                    transition: all 0.2s;
                "
                    onmouseover="this.style.background='rgba(88,101,242,0.35)'"
                    onmouseout="this.style.background='rgba(88,101,242,0.2)'"
                >
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="#818cf8">
                        <path
                            d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057c.002.022.015.045.036.057a19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028 14.09 14.09 0 0 0 1.226-1.994.076.076 0 0 0-.041-.106 13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128 10.2 10.2 0 0 0 .372-.292.074.074 0 0 1 .077-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127 12.299 12.299 0 0 1-1.873.892.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.03z"
                        />
                    </svg>
                    Sign in with Discord
                </a>
                <div id="user-avatar-area" style="display: none; align-items: center; gap: 8px;">
                    <img
                        id="user-avatar"
                        src=""
                        style="width: 32px; height: 32px; border-radius: 50%; border: 2px solid rgba(88, 101, 242, 0.5);"
                    />
                    <span
                        id="user-name"
                        style="
                        font-size: 13px;
                        font-weight: 600;
                        color: #e5e7eb;
                        max-width: 100px;
                        overflow: hidden;
                        text-overflow: ellipsis;
                        white-space: nowrap;
                    "
                    ></span>
                    <button
                        onclick="signOut()"
                        style="
                        font-size: 11px;
                        color: #4b5563;
                        background: none;
                        border: none;
                        cursor: pointer;
                        padding: 0;
                    "
                        onmouseover="this.style.color='#ef4444'"
                        onmouseout="this.style.color='#4b5563'"
                    >
                        Sign out
                    </button>
                </div>
            </div>
        </nav>
        <div class="pt-20">
            <!-- Your main page content here -->
            <h1 class="text-center text-4xl font-bold">Welcome to Anomic Values</h1>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const params = new URLSearchParams(window.location.search);
            const username = params.get('username');
            const avatar = params.get('avatar');

            const loginModal = document.getElementById('login-modal');
            const mainContent = document.getElementById('main-content');
            const userAvatarArea = document.getElementById('user-avatar-area');
            const loginBtnNav = document.getElementById('login-btn');

            if (username && avatar) {
                if (loginModal) loginModal.style.display = 'none';
                if (mainContent) mainContent.style.display = 'block';
                if (userAvatarArea) userAvatarArea.style.display = 'flex';
                if (loginBtnNav) loginBtnNav.style.display = 'none';

                document.getElementById('user-avatar').src = decodeURIComponent(avatar);
                document.getElementById('user-name').innerText = decodeURIComponent(username);

                window.history.replaceState({}, document.title, '/');
            } else {
                if (loginModal) loginModal.style.display = 'flex';
                if (mainContent) mainContent.style.display = 'none';
                if (userAvatarArea) userAvatarArea.style.display = 'none';
                if (loginBtnNav) loginBtnNav.style.display = 'flex';
            }

            if (typeof lucide !== 'undefined' && lucide.createIcons) {
                lucide.createIcons();
            }
        });

        function signOut() {
            window.location.href = '/';
        }
    </script>
</body>
</html>
